{% load static %}
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>

        <h1><a href="{% url 'teacher_dashboard' %}">School Task Portal</a></h1>
        <nav>
            <ul>
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li><a href="{% url 'completed_tasks' %}">Completed Tasks</a></li>
                <li><a href="{% url 'logout' %}">Log out</a></li>
            </ul>
        </nav>

    </header>

    <hr>

    <main>

        <h2>Teacher Dashboard</h2>

        <form>

            <div class="search-bar">
                <input type="text" name="search" placeholder="Search tasks..." class="search">
                <select id="sort" name="sort" class="sort">
                    <option value="" disabled selected>Sort by...</option>
                    <option value="priority">Priority</option>
                    <option value="status">Status</option>
                </select>
            </div>
            <button type="submit">Search</button>

        </form>

        <br>

        <table>
            <thead>
                <tr>
                    <th>Task ID</th>
                    <th>Title</th>
                    <th>Priority</th>
                    <th>Assigned By</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th id="actions">Actions</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

    </main>

    <hr>

    <footer>
        <p class="copyrights"><small>&copy; 2026 School Task Portal. All rights reserved.</small></p>
    </footer>

    <script>

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetch('/api/teacher-tasks/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('tbody');
                tbody.innerHTML = '';

                data.tasks.forEach(function (task) {
                    if (task.status !== 'Completed') {
                        const row = `
                            <tr>
                                <td>${task.id}</td>
                                <td>${task.title}</td>
                                <td class="priority-${task.priority.toLowerCase()}">${task.priority}</td>
                                <td>${task.assigned_by}</td>
                                <td>${task.status}</td>
                                <td>${task.description}</td>
                                <td class="actions-data">
                                    <a href="/view-task/${task.id}/" class="btn btn-view btn-primary" data-id="${task.id}">View</a>
                                    <a href="#" class="btn btn-complete" data-id="${task.id}">Complete</a>
                                </td>
                            </tr>`;
                        tbody.innerHTML += row;
                    }
                });
            });

        document.querySelector('tbody').addEventListener('click', function (e) {
            if (!e.target.classList.contains('btn-complete')) {
                return;
            }

            e.preventDefault();
            const taskId = e.target.getAttribute('data-id');

            fetch(`/api/complete-task/${taskId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        e.target.closest('tr').remove();
                    }
                });
        });

        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();
        });

    </script>

</body>

</html>
