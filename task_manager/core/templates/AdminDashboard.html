{% load static %}
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>

        <h1><a href="{% url 'admin_dashboard' %}">School Task Portal</a></h1>
        <nav>
            <ul>
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li><a href="{% url 'logout' %}">Log out</a></li>
            </ul>
        </nav>

    </header>

    <hr>

    <main>

        <h2>Admin Dashboard</h2>

        <table>
            <thead>
                <tr>
                    <th>Task ID</th>
                    <th>Title</th>
                    <th>Assigned To</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Description</th>
                    <th id="actions">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Task rows will be dynamically inserted here -->
            </tbody>

        </table>

        <a href="{% url 'add_task' %}" class="btn btn-addtask">+ Add New Task</a>
    </main>

    <hr>

    <footer>
        <p class="copyrights"><small>&copy; 2026 School Task Portal. All rights reserved.</small></p>
    </footer>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="confirmMessage">Are you sure you want to delete this task?</p>
            <div class="modal-buttons">
                <button id="confirmYes" class="btn btn-primary">Yes, Delete</button>
                <button id="confirmNo" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script>

        // Function to get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Global variables for confirmation modal
        let pendingTaskId = null;

        function showConfirmModal(taskId) {
            pendingTaskId = taskId;
            document.getElementById("confirmModal").style.display = "flex";
        }

        function closeConfirmModal() {
            pendingTaskId = null;
            document.getElementById("confirmModal").style.display = "none";
        }

        //confirmation modal buttons
        document.getElementById("confirmYes").addEventListener("click", function () {
            if (pendingTaskId) {
                deleteTask(pendingTaskId);
            }
            closeConfirmModal();
        });

        document.getElementById("confirmNo").addEventListener("click", closeConfirmModal);

        function deleteTask(taskId) {
            fetch(`/api/delete-task/${taskId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.querySelector(`a[data-id="${taskId}"].btn-delete`).closest("tr").remove();
                    }
                });
        }

        fetch('/api/tasks/')
            .then(response => response.json())
            .then(data => {

                let tbody = document.querySelector("tbody");
                tbody.innerHTML = ""; // Clear existing rows

                data.tasks.forEach(function (task) {

                    let row =
                        `<tr>
                        <td>${task.id}</td>
                        <td>${task.title}</td>
                        <td>${task.teacher}</td>
                        <td class="priority-${task.priority.toLowerCase()}">${task.priority}</td>
                        <td>${task.status}</td>
                        <td>${task.description}</td>
                        <td class = "action-data">
                            <a href="/edit-task/${task.id}/" class="btn btn-edit btn-primary" data-id="${task.id}">Edit</a> 
                            <a href="#" class="btn btn-delete" data-id="${task.id}">Delete</a>
                        </td>
                        </tr>
                    `;

                    tbody.innerHTML += row;

                });

            });

        document.querySelector("tbody").addEventListener("click", function (e) {
            if (e.target.classList.contains("btn-delete")) {
                e.preventDefault();
                let taskId = e.target.getAttribute("data-id");
                showConfirmModal(taskId);
            }
        });

    </script>

</body>

</html>
