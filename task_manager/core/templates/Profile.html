{% load static %}
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>

        <h1><a href="{% url 'homepage' %}">School Task Portal</a></h1>
        <nav>
            <ul>
                <li><a href="#" id="dashboard-link">Dashboard</a></li>
                <li><a href="{% url 'logout' %}">Log out</a></li>
            </ul>
        </nav>

    </header>

    <hr>

    <main>

        <h2>My Profile</h2>
        
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <fieldset>
            <legend>Account Details</legend>
            <form method="POST">
                {% csrf_token %}
                <div>
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username" value="{{ user.username }}" required>
                </div>
                <br>
                <div>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required>
                </div>
                <br>
                <div>
                    <label>Role:</label><br>
                    <input type="text" value="{% if user.role == 'admin' %}School Admin{% else %}Teacher{% endif %}" readonly disabled>
                </div>
                <br>
                <div class="form-actions">
                    <button type="submit">Update Profile</button>
                </div>
            </form>
        </fieldset>

    </main>

    <hr>

    <footer>
        <p class="copyrights"><small>&copy; 2026 School Task Portal. All rights reserved.</small></p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let role = "{{ request.session.role }}";
            let dashboard = role === "admin" ? "{% url 'admin_dashboard' %}" : "{% url 'teacher_dashboard' %}";
            
            let headerLogo = document.querySelector("header h1 a");
            if (headerLogo) headerLogo.href = dashboard;
            
            let dashboardLink = document.getElementById("dashboard-link");
            if (dashboardLink) dashboardLink.href = dashboard;
        });
    </script>

</body>

</html>
