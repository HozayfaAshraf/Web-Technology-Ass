{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completed Tasks</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>
        <h1><a href="{% url 'teacher_dashboard' %}">School Task Portal</a></h1>
        <nav>
            <ul>
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li><a href="{% url 'teacher_dashboard' %}">Dashboard</a></li>
                <li><a href="{% url 'logout' %}">Log out</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section class="table-container">
            <h2>My Completed Tasks</h2>

            <table>
                <thead>
                    <tr>
                        <th>Task ID</th>
                        <th>Title</th>
                        <th>Assigned By</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Description</th>
                        <th id="actions">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Task rows will be dynamically inserted here -->
                </tbody>
            </table>

        </section>
    </main>

    <hr>

    <footer>
        <p class="copyrights"><small>&copy; 2026 School Task Portal. All rights reserved.</small></p>
    </footer>

    <script>

        fetch('/api/teacher-tasks/')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('tbody');
                tbody.innerHTML = '';

                data.tasks.forEach(function (task) {
                    if (task.status === 'Completed') {
                        const row = `
                            <tr>
                                <td>${task.id}</td>
                                <td>${task.title}</td>
                                <td class="priority-${task.priority.toLowerCase()}">${task.priority}</td>
                                <td>${task.assigned_by}</td>
                                <td>${task.status}</td>
                                <td>${task.description}</td>
                                <td class="actions-data">
                                    <a href="/view-task/${task.id}/" class="btn btn-view btn-primary" data-id="${task.id}">View</a>
                                    <a href="#" class="btn btn-complete" data-id="${task.id}">Complete</a>
                                </td>
                            </tr>`;
                        tbody.innerHTML += row;
                    }
                });
            });

    </script>

</body>

</html>
