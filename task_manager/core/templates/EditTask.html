{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>
        <h1><a href="{% url 'admin_dashboard' %}">School Task Portal</a></h1>
        <nav>
            <ul>
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li><a href="{% url 'admin_dashboard' %}">Dashboard</a></li>
                <li><a href="{% url 'logout' %}">Log out</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section class="form-container">
            <h2>Edit Task Details</h2>

            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <fieldset>
                    <legend>Modify Task</legend>

                    <div>
                        <label for="taskId">Task ID:</label><br>
                        <input type="number" id="taskId" name="taskId" value="{{ task.id }}" readonly>
                    </div>
                    <br>

                    <div>
                        <label for="taskTitle">Task Title:</label><br>
                        <input type="text" id="taskTitle" name="taskTitle" value="{{ task.title }}" required>
                    </div>
                    <br>

                    <div>
                        <label for="teacherName">Assigned Teacher:</label><br>
                        <select id="teacherName" name="teacherName" required>
                            {% for teacher in teachers %}
                                <option value="{{ teacher.username }}" {% if task.assigned_to.username == teacher.username %}selected{% endif %}>{{ teacher.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <br>

                    <div>
                        <label for="priority">Priority Level:</label><br>
                        <select id="priority" name="priority" required>
                            <option value="low" {% if task.priority == 'low' %}selected{% endif %}>Low</option>
                            <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
                            <option value="high" {% if task.priority == 'high' %}selected{% endif %}>High</option>
                        </select>
                    </div>
                    <br>

                    <div>
                        <label for="description">Task Description:</label><br>
                        <textarea id="description" name="description" rows="5" cols="40" required>{{ task.description }}</textarea>
                    </div>

                    <br>

                </fieldset>

                <br>

                <div class="form-actions">
                    <button type="submit">Save Changes</button>
                    <a href="{% url 'admin_dashboard' %}"><button type="button" class="btn-cancel">Cancel</button></a>
                </div>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p class="copyrights"><small>&copy; 2026 School Task Portal. All rights reserved.</small></p>
    </footer>

</body>

</html>
