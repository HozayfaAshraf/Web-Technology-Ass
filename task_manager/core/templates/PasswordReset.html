{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <header>
        <h1><a href="{% url 'homepage' %}">School Task Portal</a></h1>
        <nav>
            <ul>
                <li><a href="{% url 'homepage' %}">Home</a></li>
                <li><a href="{% url 'signup' %}">Sign up</a></li>
                <li><a href="{% url 'login' %}">Log in</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <main>
        <section class="form-container">
            <h2>Reset Your Password</h2>
            
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <fieldset>
                    <legend><strong>Account Verification</strong></legend>

                    <div>
                        <label for="email">Email Address:</label><br>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required
                            autofocus>
                    </div>
                    <br>

                    <div>
                        <label for="new_password">New Password:</label><br>
                        <input type="password" id="new_password" name="new_password" placeholder="Minimum 8 characters"
                            minlength="8" required>
                    </div>
                    <br>

                    <div>
                        <label for="confirm_password">Confirm New Password:</label><br>
                        <input type="password" id="confirm_password" name="confirm_password"
                            placeholder="Re-enter your new password" minlength="8" required>
                    </div>
                </fieldset>

                <br>

                <div class="form-actions">
                    <button type="submit">Update Password</button>
                    <a href="{% url 'login' %}"><button type="button" class="btn-cancel">Cancel</button></a>
                </div>
            </form>

        </section>
    </main>

    <hr>

    <footer>
        <p class="copyrights"><small>&copy; 2026 School Task Portal. All rights reserved.</small></p>
    </footer>
</body>

</html>
